version: 2

models:
  - name: stg_transactions
    description: Transactions DVF typees et dedoublonnees (une ligne par mutation, parcelle et local).
    columns:
      - name: id_mutation
        data_tests:
          - not_null
      - name: date_mutation
        data_tests:
          - not_null
      - name: nature_mutation
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Vente
                  - Vente en l''état futur d''achèvement
                  - Vente terrain à bâtir
                  - Echange
                  - Adjudication
                  - Expropriation
      - name: type_local
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Maison
                  - Appartement
                  - Dépendance
                  - Local industriel. commercial ou assimilé
