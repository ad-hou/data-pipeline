# Pipeline DVF : entrepot Postgres + Airflow 3 (LocalExecutor). Usage local uniquement.
x-airflow-common: &airflow-common
  build: ./airflow
  image: dvf-airflow:3.3.2
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API_AUTH__JWT_SECRET: dev-only-secret-change-me-0123456789
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    WH_HOST: warehouse
    WH_PORT: "5432"
    WH_DB: dvf
    WH_USER: dvf
    WH_PASSWORD: dvf
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt_project:/opt/airflow/dbt_project
    - ./data:/opt/airflow/data
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: dvf
      POSTGRES_PASSWORD: dvf
      POSTGRES_DB: dvf
    ports:
      - "5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvf -d dvf"]
      interval: 5s
      retries: 10

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    depends_on:
      airflow-db:
        condition: service_healthy
    command: ["bash", "-c", "airflow db migrate"]

  airflow-apiserver:
    <<: *airflow-common
    command: ["api-server"]
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]

  airflow-triggerer:
    <<: *airflow-common
    command: ["triggerer"]

  dashboard:
    build: ./dashboard
    environment:
      WH_HOST: warehouse
      WH_PORT: "5432"
      WH_DB: dvf
      WH_USER: dvf
      WH_PASSWORD: dvf
    ports:
      - "8501:8501"
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  warehouse-data:
  airflow-db-data:
